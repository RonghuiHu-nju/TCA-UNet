[DDP]
dist_backend = "nccl"
world_size = 1

[FFT]
sample_rate = 16000
n_fft = 512
hop_length = 256
win_length = 512

[trainer]
epochs = 350
save_checkpoint_interval = 1
clip_grad_norm_value = 10.0
exp_path = "/data/ssd0/ronghui.hu/AEC_E2E/TCA-UNET/GRU-T-GROUP/exp/exp"
resume = false

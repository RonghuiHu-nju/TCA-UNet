[sbss_config]
L = 7
nfft = 512
shift = 256
alpha = 0.95
beta = 0.4

[train_dataset]
fs = 16000
length_in_seconds = 8
num_data_per_epoch = 10000
random_start_point = true
train = true

[train_dataloader]
batch_size = 8
num_workers = 4
drop_last = true
pin_memory = true

[validation_dataset]
fs = 16000
length_in_seconds = 8
random_start_point = true
train = false

[validation_dataloader]
